packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for dependency versions across the monorepo.
# Workspace packages reference these with "catalog:".
catalog:
  # Runtime
  "next": 16.3.5
  "react": 19.3.0
  "react-dom": 19.3.0
  "@mantine/core": 9.6.1
  "@mantine/hooks": 9.6.1
  "@mantine/form": 9.6.1
  "lucide-react": 1.47.0
  "zod": 4.6.5
  "@tanstack/react-query": 5.103.1
  "@tanstack/react-table": 9.2.4
  "zustand": 5.0.15
  "appwrite": 27.0.0
  "node-appwrite": ^17.0.0

  # Types
  "@types/node": 26.6.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

  # Tooling
  "typescript": 5.9.3
  "eslint": 10.11.0
  "@eslint/js": 10.0.1
  "typescript-eslint": 8.70.0
  "eslint-config-prettier": 10.1.8
  "eslint-plugin-react-hooks": 7.1.1
  "@next/eslint-plugin-next": 16.3.5
  "globals": 17.12.0
  "prettier": 3.9.8
  "tsx": 4.19.0
  "vitest": 5.0.1
  "vite": 8.3.0
  "@vitejs/plugin-react": 6.1.1
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/user-event": 14.6.7
  "jsdom": 30.1.0
  "postcss": 8.5.28
  "postcss-preset-mantine": 1.18.0
  "postcss-simple-vars": 7.0.1

minimumReleaseAgeExclude:
  - eslint@10.11.0

# Native/postinstall build scripts allowed to run (pnpm blocks them by default).
onlyBuiltDependencies:
  - esbuild
  - sharp
