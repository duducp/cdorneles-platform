name: Deploy Sites

# Production deploy of the Next.js apps to Appwrite Sites.
#
# Triggers:
#   - called by the release workflow when release-please cuts a release;
#   - a manual run (`workflow_dispatch`) deploys one site or all of them.
#
# There is deliberately no `push: tags` trigger. Release tags are created with
# GITHUB_TOKEN, which does not trigger other workflows, so the release workflow
# calls this one explicitly. Allowing a tag push to deploy as well would open
# the door to two deploys of different commits.
#
# The deploy job uses the `production` GitHub Environment, so it can require
# reviewers. Required secrets:
#   APPWRITE_ENDPOINT, APPWRITE_PROJECT_ID, APPWRITE_API_KEY
#
# Repository variables (not secrets — they identify the Git connection, not a
# credential), used to link newly created sites:
#   SITE_INSTALLATION_ID, SITE_REPOSITORY_ID
#
# APPWRITE_ENDPOINT and APPWRITE_PROJECT_ID are also pushed to the sites as
# NEXT_PUBLIC_APPWRITE_* build-time variables.

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - admin
          - client
          - design-system
  workflow_call:
    inputs:
      site:
        description: Site to deploy
        required: false
        type: string
        default: all

# Never let two deploys race; a running deploy is allowed to finish.
concurrency:
  group: sites-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # This job only runs the Appwrite CLI; pnpm is not installed here.
          # setup-node v5 enables caching automatically when package.json
          # declares a packageManager, which then fails on the missing binary.
          package-manager-cache: false

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      - name: Configure Appwrite CLI
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY"

      - name: Deploy
        env:
          TARGET: ${{ inputs.site || 'all' }}
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          # Not secrets: they identify the repository connection, not a
          # credential. Set them as repository variables so newly created
          # sites are linked to Git instead of falling back to upload.
          SITE_INSTALLATION_ID: ${{ vars.SITE_INSTALLATION_ID }}
          SITE_REPOSITORY_ID: ${{ vars.SITE_REPOSITORY_ID }}
        run: |
          if [ -z "$TARGET" ] || [ "$TARGET" = "all" ]; then
            ./scripts/deploy-sites.sh
          else
            ./scripts/deploy-sites.sh "$TARGET"
          fi
